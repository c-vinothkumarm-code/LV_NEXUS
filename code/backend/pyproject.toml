[project]
name = "multicloud-control-plane"
version = "0.2.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 165
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S105", "S106"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"migrations/*" = ["E501", "I"]
"tests/*" = ["S105", "S106", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true          # paths in coverage.xml relative to backend/, so SonarQube can map them in any checkout
omit = ["app/validate_cloud.py"]

[tool.coverage.report]
skip_empty = true
