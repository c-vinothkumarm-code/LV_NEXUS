# nginx main configuration for the unprivileged image (runs as uid 101, listens on 8080 / 8443).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # temp paths on tmpfs (root filesystem is read-only)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # access log without query strings (they can carry filters with names) and without cookies or auth headers
    log_format main escape=json '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
                                '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
                                '"upstream":"$upstream_response_time","request_id":"$request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 30s;
    server_tokens   off;
    client_max_body_size 10m;          # largest upload: budget spreadsheet import / evidence
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # per-client rate limits (defence in depth; the application also limits per IP)
    limit_req_zone $binary_remote_addr zone=lvn_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=lvn_api:20m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=lvn_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    include /etc/nginx/conf.d/*.conf;
}
