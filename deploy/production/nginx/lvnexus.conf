# LV NEXUS virtual host. Replace lvnexus.example.internal with the real host name (scripts/install.sh does this).
upstream lvnexus_api {
    server 172.30.10.20:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP: only redirect to HTTPS (and nothing else)
server {
    listen 8080 default_server;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name lvnexus.example.internal;

    # --- TLS (Mozilla "intermediate" profile: TLS 1.2 + 1.3)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LVN_TLS:10m;
    ssl_session_tickets off;

    # --- security headers (the application sets CSP; these are added for every response, including errors)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Request-ID $request_id always;

    limit_conn lvn_conn 50;

    # never serve hidden files or common secret file names
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(env|pem|key|pfx|p12|sql|bak|ini)$ { return 404; }

    # proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;        # overwrite, never append a client-supplied value
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # sign-in endpoints: strict rate limit
    location ~ ^/api/v1/auth/(login|callback) {
        limit_req zone=lvn_auth burst=10 nodelay;
        proxy_pass http://lvnexus_api;
    }

    # live activity stream (Server-Sent Events): no buffering, long read timeout
    location = /api/v1/activity/stream {
        limit_req zone=lvn_api burst=20 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://lvnexus_api;
    }

    location /api/ {
        limit_req zone=lvn_api burst=60 nodelay;
        proxy_pass http://lvnexus_api;
    }

    # liveness for monitoring (no data)
    location = /health {
        access_log off;
        proxy_pass http://lvnexus_api;
    }
    # readiness exposes database state: keep it internal
    location = /health/ready { return 404; }

    # built web application (served by the API container), long cache for fingerprinted assets
    location /assets/ {
        proxy_pass http://lvnexus_api;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://lvnexus_api;
    }
}
