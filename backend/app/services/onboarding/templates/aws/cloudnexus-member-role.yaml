AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  LV NEXUS (CloudNexus) read-only role for every member account. Deploy as a CloudFormation StackSet from the management
  account with service-managed permissions, targeting the organization root, automatic deployment ON (new accounts get it too).

Parameters:
  ManagementAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: 12-digit AWS Organizations management account ID.
  ExternalId:
    Type: String
    MinLength: 16
    NoEcho: true
    Description: Random value generated by LV NEXUS (Onboard a cloud > AWS); shown only to connection managers.
  RoleName:
    Type: String
    Default: CloudNexusReadOnly
  SsoPermissionSetName:
    Type: String
    Default: CloudNexusReader
    Description: >-
      IAM Identity Center permission set (in the management account) that may also use this role, for running LV NEXUS
      from a PC with "aws sso login" (no access keys). Leave as is if unused: nobody has it unless you assign it.

  AllowedSourceIps:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Optional. Public egress IP ranges of the LV NEXUS server (CIDR, comma separated). When set, this role can only be
      used from those addresses. Leave empty to not restrict by IP (for example while testing from a PC).

Conditions:
  RestrictSourceIp: !Not [ !Equals [ !Join [ "", !Ref AllowedSourceIps ], "" ] ]

Resources:
  MemberRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: LV NEXUS read-only access. Never writes, changes or deletes anything.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${ManagementAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
              ArnLike:
                # only these two identities in the management account, nothing else
                "aws:PrincipalArn":
                  - !Sub "arn:aws:iam::${ManagementAccountId}:role/CloudNexusManagementReader"
                  - !Sub "arn:aws:iam::${ManagementAccountId}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_${SsoPermissionSetName}_*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
        - arn:aws:iam::aws:policy/SecurityAudit
      Policies:
        - PolicyName: cloudnexus-guardrails
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # defence in depth: the read-only managed policies already exclude these, the explicit deny keeps it so
              # even if a broader policy is attached later. LV NEXUS reads metadata, never data content or secrets.
              - Sid: NoDataContentOrSecretReads
                Effect: Deny
                Action:
                  - "s3:GetObject*"
                  - "secretsmanager:GetSecretValue"
                  - "ssm:GetParameter*"
                  - "kms:Decrypt"
                  - "dynamodb:GetItem"
                  - "dynamodb:BatchGetItem"
                  - "dynamodb:Query"
                  - "dynamodb:Scan"
                  - "rds-data:*"
                  - "athena:GetQueryResults"
                  - "lambda:GetFunction"
                  - "ec2:GetPasswordData"
                  - "ec2:GetConsoleOutput"
                  - "ec2:GetConsoleScreenshot"
                  - "logs:GetLogEvents"
                  - "logs:FilterLogEvents"
                  - "sqs:ReceiveMessage"
                  - "kinesis:GetRecords"
                Resource: "*"
              - !If
                - RestrictSourceIp
                - Sid: OnlyFromTheLvNexusServer
                  Effect: Deny
                  Action: "*"
                  Resource: "*"
                  Condition:
                    NotIpAddress:
                      "aws:SourceIp": !Ref AllowedSourceIps
                    Bool:
                      "aws:ViaAWSService": "false"
                - !Ref AWS::NoValue
