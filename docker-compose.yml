# Optional local stack (the VS Code guide runs everything without Docker):  docker compose up --build  ->  http://localhost:8080
services:
  mysql:
    image: mysql:8.0
    environment: { MYSQL_DATABASE: mcp, MYSQL_USER: mcp, MYSQL_PASSWORD: mcp, MYSQL_ROOT_PASSWORD: change-me-root }
    command: ["--character-set-server=utf8mb4", "--log-bin-trust-function-creators=1"]
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umcp", "-pmcp"], interval: 5s, retries: 20 }
  api:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "mysql+pymysql://mcp:mcp@mysql:3306/mcp?charset=utf8mb4", FRONTEND_URL: "http://localhost:8080" }
    ports: ["8080:8080"]
    depends_on: { mysql: { condition: service_healthy } }
  scheduler:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "mysql+pymysql://mcp:mcp@mysql:3306/mcp?charset=utf8mb4" }
    command: ["python", "-m", "app.workers.local_scheduler"]
    depends_on: [api]
volumes:
  mysqldata:
